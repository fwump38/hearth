# Portainer / docker compose stack for Unraid.
# Put the secrets in the stack's environment variables (Portainer "Environment variables"), not in this file.
services:
  hearth:
    image: ghcr.io/fwump38/hearth:latest   # built by .github/workflows/docker.yml
    container_name: hearth
    restart: unless-stopped
    user: "${PUID:-99}:${PGID:-100}"   # Unraid default: nobody:users
    ports:
      - "8080:8080"
    volumes:
      - ${APPDATA:-/mnt/user/appdata/hearth}:/data
    environment:
      BASE_URL: ${BASE_URL}                         # public URL, e.g. https://recipes.example.com
      OIDC_ISSUER: ${OIDC_ISSUER}                   # e.g. https://auth.example.com/application/o/hearth/
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}   # add 'groups' only if your provider needs it for the groups claim
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}  # optional, comma separated Authentik groups
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}      # enables URL/text import
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      TZ: ${TZ:-America/Denver}
